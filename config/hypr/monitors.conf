# Set GDK_SCALE for high-DPI displays, needs to match highest scale of monitor below for certain apps that use this to know how to scale.
env = GDK_SCALE,1.6

# nwg-displays is a GUI tool for visually arranging monitors in Hyprland. Install it with `yay -S nwg-displays`, then run `nwg-displays` to drag/align screens and apply changes.
# Laptop display, positioned at origin
monitor = eDP-2, 1920x1080@144, 0x0, 1

# 5K monitor, centered above laptop display
monitor = HDMI-A-1, 5120x2160@45, -640x-1350, 1.6

# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale
# You must relaunch Hyprland after changing any envs (use Super+Esc, then Relaunch)

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
# env = GDK_SCALE,2
# monitor=,preferred,auto,auto

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.666667

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# env = GDK_SCALE,1
# monitor=eDP-2,preferred,0x0,1
# monitor=HDMI-A-1,preferred,-1920x0,1

# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2

# TIPS:
# Run `hyprctl monitors` to get monitor names and details
# Run `hyprctl clients` to get classes for current windows
# Run `hyprctl workspaces` to get workspaces details for making rules

# Workspace rules for monitor assignments https://wiki.hypr.land/Configuring/Workspace-Rules/
# workspace = 1, monitor:eDP-2, persistent:true, on-created-empty:hyprctl dispatch movetoworkspacesilent 1 monitor:eDP-2
workspace = 1, monitor:eDP-2, persistent:true # AI
workspace = 2, monitor:eDP-2, persistent:true # Browser for checking docs
workspace = 3, monitor:HDMI-A-1, default:true, persistent:true # Editor (VSCode now, Neovim later)
workspace = 4, monitor:HDMI-A-1, persistent:true
workspace = 5, monitor:HDMI-A-1, persistent:true
workspace = 6, monitor:eDP-2, persistent:true
workspace = 7, monitor:eDP-2, persistent:true

# workspace = 0, monitor:HDMI-A-1, persistent:true
# on-created-empty:hyprctl dispatch movetoworkspacesilent 0 monitor:eDP-2

# "Smart gaps" / "No gaps when only"
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

general {
    gaps_in = 0
    gaps_out = 0

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true
}